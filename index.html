<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spartan Fit50 SheetDB</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-orange-500/30">

    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
        <div>
            <span class="text-xs font-bold tracking-widest text-orange-500 uppercase">SPARTAN LEAN PROGRAM</span>
            <h1 class="text-lg font-bold text-slate-100 flex items-center gap-1">Fit50 <span class="font-light text-slate-400"> ] PRO</span></h1>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-1.5">
            <div class="w-2 h-2 rounded-full bg-orange-400 animate-pulse"></div>
            <span id="userBadge" class="text-xs font-medium text-slate-300" onclick="changeName()">Loading...</span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-6 max-w-md mx-auto w-full pb-24">
        
        <div id="workoutView" class="space-y-6">
            
            <div class="space-y-1.5">
                <label class="text-[11px] font-bold text-slate-400 tracking-wider uppercase block">Select Focus Workout</label>
                <select id="workoutSelector" onchange="onWorkoutChanged(this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-200 font-semibold focus:outline-none focus:border-orange-500 cursor-pointer">
                    </select>
            </div>

            <div class="bg-orange-950/20 border border-orange-500/20 rounded-xl p-3 text-xs text-slate-400 flex items-start gap-2">
                <span class="text-base leading-none">🎯</span>
                <p>
                    <strong class="text-orange-400">Spartan Shred Philosophy:</strong> High metabolic demand combined with explosive push vectors. Keep your breaks tight to keep your body cut.
                </p>
            </div>

            <div id="exerciseContainer" class="space-y-5">
                </div>

            <button onclick="submitWorkout()" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-500/10 transition-all active:scale-[0.99] cursor-pointer text-center text-sm">
                Log Completed Workout
            </button>
        </div>

        <div id="feedView" class="space-y-4 hidden">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Squad Performance Feed</h2>
                <button onclick="fetchFeed()" class="text-xs text-orange-400 font-medium bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">Refresh</button>
            </div>
            <div id="feedContainer" class="space-y-3">
                </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-6 py-2 max-w-md mx-auto rounded-t-2xl shadow-2xl">
        <div class="flex justify-around items-center">
            <button id="navWorkout" onclick="switchTab('workout')" class="flex flex-col items-center gap-1 py-1 px-4 text-orange-400 transition-colors cursor-pointer">
                <span class="text-lg">🏋️‍♂️</span>
                <span class="text-[10px] font-semibold tracking-wide">Workouts</span>
            </button>
            <button id="navFeed" onclick="switchTab('feed')" class="flex flex-col items-center gap-1 py-1 px-4 text-slate-400 hover:text-slate-200 transition-colors cursor-pointer">
                <span class="text-lg">🔥</span>
                <span class="text-[10px] font-semibold tracking-wide">Team Activity</span>
            </button>
        </div>
    </nav>

    <script>
        // PASTE YOUR SHEETDB API KEY LINK DIRECTLY HERE
        const SHEETDB_API_URL = "https://sheetdb.io/api/v1/o8eo17xa2gyvq"; 

        // Comprehensive Workout Splits mapped from Spartan Program
        const spartanProgram = {
            "Monday: Full-Body Strength": [
                { id: "m1", name: "Bodyweight Squat", target: "3 Sets x 20 Reps", motion: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] },
                { id: "m2", name: "Barbell Bench Press", target: "4 Sets x 6 Reps", motion: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0, 0] },
                { id: "m3", name: "Standing Military Press", target: "4 Sets x 10 Reps", motion: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0, 0] },
                { id: "m4", name: "Barbell Deadlift", target: "4 Sets x 6-8 Reps", motion: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0, 0] }
            ],
            "Tuesday: Upper-Body HIIT": [
                { id: "t1", name: "Incline DB Chest Fly", target: "3 Sets x 10 Reps", motion: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] },
                { id: "t2", name: "Burpees", target: "7 Sets x 8 Reps", motion: "https://images.unsplash.com/photo-1598971639058-fab3c3109a00?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0, 0, 0, 0, 0] },
                { id: "t3", name: "Tripod Dumbbell Row", target: "3 Sets x 10 Reps", motion: "https://images.unsplash.com/photo-1605296867304-46d5465a25f1?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] },
                { id: "t4", name: "Hammer Curls", target: "3 Sets x 12 Reps", motion: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] }
            ],
            "Wednesday: Lower-Body HIIT": [
                { id: "w1", name: "Goblet Squat (Dumbbell)", target: "3 Sets x 15 Reps", motion: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] },
                { id: "w2", name: "Dumbbell Romanian Deadlift", target: "3 Sets x 12 Reps", motion: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] },
                { id: "w3", name: "Walking Lunges", target: "5 Sets x 20 Reps", motion: "https://images.unsplash.com/photo-1434608519344-49d77a699e1d?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0, 0, 0] }
            ],
            "Friday: Full-Body HIIT & Core": [
                { id: "f1", name: "Chin-Ups / Pull-Ups", target: "3 Sets x 5 Reps", motion: "https://images.unsplash.com/photo-1598971639058-fab3c3109a00?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] },
                { id: "f2", name: "Bench Dips", target: "3 Sets x 12 Reps", motion: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] },
                { id: "f3", name: "Thrusters (Squat to Press)", target: "3 Sets x 10 Reps", motion: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=350&q=80", sets: [0, 0, 0] }
            ]
        };

        let activeWorkoutKey = Object.keys(spartanProgram)[0];
        let userName = localStorage.getItem('fit50_name') || "Spartan_" + Math.floor(Math.random() * 900 + 100);

        function init() {
            localStorage.setItem('fit50_name', userName);
            document.getElementById('userBadge').innerText = userName;
            populateDropdownSelector();
            renderExercises();
            fetchFeed();
        }

        function changeName() {
            const newName = prompt("Enter identity handle name:", userName);
            if(newName && newName.trim().length > 1) {
                userName = newName.trim();
                localStorage.setItem('fit50_name', userName);
                document.getElementById('userBadge').innerText = userName;
            }
        }

        function populateDropdownSelector() {
            const selectEl = document.getElementById('workoutSelector');
            selectEl.innerHTML = '';
            Object.keys(spartanProgram).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = key;
                selectEl.appendChild(opt);
            });
            selectEl.value = activeWorkoutKey;
        }

        function onWorkoutChanged(selectedKey) {
            activeWorkoutKey = selectedKey;
            renderExercises();
        }

        function renderExercises() {
            const container = document.getElementById('exerciseContainer');
            container.innerHTML = '';

            spartanProgram[activeWorkoutKey].forEach(ex => {
                let inputsHTML = '';
                ex.sets.forEach((weight, i) => {
                    inputsHTML += `
                        <div class="flex items-center justify-between bg-slate-950/50 border border-slate-800 rounded-xl px-2.5 py-1.5">
                            <span class="text-[10px] font-bold text-slate-500">S-${i+1}</span>
                            <div class="flex items-center gap-1.5">
                                <input type="number" pattern="[0-9]*" inputmode="numeric" placeholder="-" 
                                    value="${weight || ''}" 
                                    onchange="updateSet('${ex.id}', ${i}, this.value)"
                                    class="w-11 bg-slate-900 text-center text-xs font-bold text-orange-400 border border-slate-700 py-1 rounded focus:outline-none focus:border-orange-500" />
                                <span class="text-[9px] text-slate-600">lbs</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl">
                        <div class="w-full h-28 bg-slate-950 relative overflow-hidden border-b border-slate-800">
                            <img src="${ex.motion}" alt="${ex.name}" class="w-full h-full object-cover opacity-60">
                            <div class="absolute bottom-2 left-3 bg-slate-950/80 backdrop-blur border border-slate-800 px-2 py-0.5 rounded-md">
                                <p class="text-[10px] font-mono font-medium text-orange-400 uppercase tracking-wider">Form Motion Guide</p>
                            </div>
                        </div>
                        <div class="p-4 space-y-3">
                            <div>
                                <h3 class="text-sm font-bold tracking-tight text-slate-100">${ex.name}</h3>
                                <p class="text-[11px] text-orange-400 font-semibold mt-0.5">${ex.target}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 pt-1">
                                ${inputsHTML}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function updateSet(exId, setIdx, val) {
            const exercise = spartanProgram[activeWorkoutKey].find(e => e.id === exId);
            if(exercise) exercise.sets[setIdx] = parseInt(val) || 0;
        }

        function switchTab(target) {
            const workoutView = document.getElementById('workoutView');
            const feedView = document.getElementById('feedView');
            const navWorkout = document.getElementById('navWorkout');
            const navFeed = document.getElementById('navFeed');

            if (target === 'workout') {
                workoutView.classList.remove('hidden');
                feedView.classList.add('hidden');
                navWorkout.className = "flex flex-col items-center gap-1 py-1 px-4 text-orange-400 transition-colors cursor-pointer";
                navFeed.className = "flex flex-col items-center gap-1 py-1 px-4 text-slate-400 transition-colors cursor-pointer";
            } else {
                workoutView.classList.add('hidden');
                feedView.classList.remove('hidden');
                navWorkout.className = "flex flex-col items-center gap-1 py-1 px-4 text-slate-400 transition-colors cursor-pointer";
                navFeed.className = "flex flex-col items-center gap-1 py-1 px-4 text-orange-400 transition-colors cursor-pointer";
                fetchFeed();
            }
        }

        async function submitWorkout() {
            if(SHEETDB_API_URL === "YOUR_SHEETDB_API_URL") {
                alert("Please add your SheetDB API URL inside the script file segment first!");
                return;
            }

            const currentExercises = spartanProgram[activeWorkoutKey];
            let summaryParts = [];
            
            currentExercises.forEach(ex => {
                const maxWeight = Math.max(...ex.sets);
                if (maxWeight > 0) {
                    summaryParts.push(`${ex.name} (${maxWeight}lbs)`);
                } else {
                    summaryParts.push(`${ex.name} (Done)`);
                }
            });

            const summaryString = summaryParts.join(', ');

            const payload = {
                data: [
                    { user_name: userName, workout_day: activeWorkoutKey, summary: summaryString }
                ]
            };

            try {
                const response = await fetch(SHEETDB_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("🔥 Session completed & logged to global feed tracker!");
                    switchTab('feed');
                } else {
                    alert("Failed uploading metrics payload.");
                }
            } catch (error) {
                console.error("Transmission breakdown connection:", error);
            }
        }

        async function fetchFeed() {
            if(SHEETDB_API_URL === "YOUR_SHEETDB_API_URL") return;

            const container = document.getElementById('feedContainer');
            container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Syncing data streams from Google Sheet...</p>`;

            try {
                const response = await fetch(SHEETDB_API_URL);
                if (!response.ok) throw new Error("Connection failed");
                
                let data = await response.json();
                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">No workouts uploaded yet.</p>`;
                    return;
                }

                data.reverse();
                container.innerHTML = '';
                
                data.slice(0, 20).forEach(item => {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-4 space-y-1.5">
                            <div class="flex justify-between items-center border-b border-slate-800/50 pb-1.5">
                                <span class="text-xs font-bold text-orange-400">⚡ ${item.user_name}</span>
                                <span class="text-[9px] font-mono text-slate-500">Verified Fit</span>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide block">${item.workout_day}</span>
                                <p class="text-xs text-slate-300 leading-relaxed mt-1">${item.summary}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Read matrix issue:", error);
                container.innerHTML = `<p class="text-center text-xs text-rose-400 py-6">Could not pull activity data.</p>`;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
